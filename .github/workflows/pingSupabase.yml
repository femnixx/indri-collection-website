name: Supabase Keep Alive Cron

on:
  schedule:
    # Jalan setiap hari Minggu jam 00:00 (seminggu sekali)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -s -X GET 'https://qstpzlyspipciotwbenp.supabase.co/rest/v1/categories?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"